name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: emdb
          POSTGRES_PASSWORD: emdb
          POSTGRES_DB: emdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U emdb -d emdb"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://emdb:emdb@localhost:5432/emdb
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: ci-secret

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --workspaces --if-present || npm install --workspaces --if-present

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Prisma — applique l'historique de migrations
        run: |
          cd packages/db
          npm run migrate:deploy
          npm run generate
          cd ../..

      - name: Applique les objets SQL hors-Prisma (triggers, fonctions, vues matérialisées)
        run: |
          cd packages/db
          npm run apply:raw-sql
          cd ../..

      - name: Détecte une dérive entre les migrations et schema.prisma
        run: npx prisma migrate diff --exit-code --from-url "$DATABASE_URL" --to-schema-datamodel packages/db/prisma/schema.prisma

      - name: Tests
        run: npm run test --workspaces --if-present
