services:
  postgres:
    image: postgres:16-alpine
    container_name: emdb-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: emdb
      POSTGRES_PASSWORD: emdb
      POSTGRES_DB: emdb
    ports:
      - '5432:5432'
    volumes:
      - emdb_postgres_data:/var/lib/postgresql/data
      # Seul le rôle `emdb_app` (restreint, sans BYPASSRLS — cf.
      # packages/db/sql/setup_roles.sql) est auto-créé au premier démarrage.
      # Le schéma n'est PAS auto-init : après le premier `docker compose up -d`,
      # appliquer (une fois) :
      #   npm run prisma:migrate:deploy   (tables, via packages/db/prisma/migrations)
      #   npm run prisma:apply-raw-sql    (extension, trigger, fonctions)
      #   npm run dbt -- build             (requis : la page Profil dépend en
      #                                      direct de la vue int_watches_enriched,
      #                                      pas seulement les 8 tables dataviz)
      # cf. wiki/Architecture pour le détail du workflow de migration.
      - ./packages/db/sql/setup_roles.sql:/docker-entrypoint-initdb.d/01-setup_roles.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U emdb -d emdb']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: emdb-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - emdb_redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: emdb-api
    restart: unless-stopped
    # Le Dockerfile utilise `node dist/main` (build de prod) pour le déploiement
    # cloud. En local, `./apps/api` est monté en volume par-dessus l'image (donc
    # sans le `dist/` généré au build) : on repasse en mode watch (ts-node/nest).
    command: npm run start:dev
    env_file:
      - .env
    environment:
      # Rôle restreint (sans BYPASSRLS) : c'est ce conteneur qui sert les
      # requêtes utilisateur, donc celui qui doit être soumis aux policies
      # RLS (migration enable_rls_user_scoped_tables). Le worker garde le
      # rôle d'origine (bypass) — cf. service `worker` ci-dessous.
      DATABASE_URL: postgresql://emdb_app:emdb_app@postgres:5432/emdb
      REDIS_URL: redis://redis:6379
      IMPORT_TMP_DIR: /tmp/emdb-import
      # false en local : le conteneur `worker` gère déjà les jobs BullMQ,
      # cf. EMBED_WORKER dans apps/api/src/main.ts pour le déploiement cloud.
      EMBED_WORKER: 'false'
    ports:
      - '3001:3001'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./apps/api:/app/apps/api
      # - ./packages:/app/packages
      - /app/node_modules
      - emdb_import_tmp:/tmp/emdb-import

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    container_name: emdb-worker
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Rôle d'origine (BYPASSRLS) : les jobs du worker sont par nature
      # transverses à tous les utilisateurs (sync TMDB, notifications...),
      # jamais scopés à un seul — cf. wiki/Architecture#securite.
      DATABASE_URL: postgresql://emdb:emdb@postgres:5432/emdb
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./apps/worker:/app/apps/worker
      - ./packages:/app/packages
      - /app/node_modules
      - emdb_import_tmp:/tmp/emdb-import

volumes:
  emdb_postgres_data:
  emdb_redis_data:
  emdb_import_tmp:
