<svg viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <rect width="512" height="512" rx="96" fill="#D6241D"/>

  <g transform="translate(256 268) rotate(-18)">
    <!-- bobine : disque + rebord, façon icône "video reel" -->
    <circle cx="0" cy="0" r="150" fill="#0A0A0A"/>
    <circle cx="0" cy="0" r="150" fill="none" stroke="#0A0A0A" stroke-width="14"/>

    <!-- oeil en évidement, style contour épais -->
    <g>
      <path d="M -108 0
               C -70 -66, 70 -66, 108 0
               C 70 66, -70 66, -108 0 Z"
            fill="#D6241D"/>
      <path d="M -108 0
               C -70 -66, 70 -66, 108 0
               C 70 66, -70 66, -108 0 Z"
            fill="none" stroke="#0A0A0A" stroke-width="20"/>
      <circle cx="0" cy="0" r="42" fill="none" stroke="#0A0A0A" stroke-width="20"/>
      <circle cx="0" cy="0" r="16" fill="#0A0A0A"/>
    </g>

    <!-- perforations de pellicule qui débordent du disque, façon bobine inclinée -->
    <g fill="#0A0A0A">
      <rect x="-240" y="-166" width="26" height="26" rx="4"/>
      <rect x="-206" y="-140" width="26" height="26" rx="4"/>
      <rect x="-172" y="-114" width="26" height="26" rx="4"/>
      <rect x="-138" y="-88" width="26" height="26" rx="4"/>
    </g>
  </g>
</svg>
